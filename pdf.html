<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio AUTH · PDF</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<script src="config.js?v=20261019d"></script>
<script src="assets/auth.js?v=20261019d"></script>
<script src="assets/ppt.js?v=20261019d"></script>
<style>
  /* Regra da entrega por escrito: Arial 12, espaçamento 1,5, capa + até 5 laudas. Visual: identidade v2. */
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  :root { --g: #121C3A; --g2: #1C2850; --m: #5A5E66; --l: #D5D8DE; --l2: #E6E8EC; --cz: #F1F2F4; --a: #1F5FD6; --ceu: #6FC3FF;
          --faixa: linear-gradient(90deg, #1F5FD6, #13A3AF, #6CC24A, #F08A1C, #E4237A); --d: Arial, Helvetica, sans-serif; }
  html, body { margin: 0; }
  body { background: #E6E8EC; color: var(--g); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 12px 20px; background: var(--g); color: #fff; font: 14px/1.4 Arial, sans-serif; }
  .bar button { border: 0; border-radius: 8px; padding: 10px 18px; background: var(--a); color: #fff; font: 700 15px Arial, sans-serif; cursor: pointer; }
  .bar button.sec { background: transparent; border: 1.5px solid #fff; }
  .bar button[disabled] { opacity: .6; cursor: wait; }
  /* Durante a geração do PDF: sem contorno de aviso nem sombra */
  body.capturando .page { outline: none !important; box-shadow: none; }
  body.capturando .page.over::after { display: none; }
  .bar a { color: #fff; }
  .bar .w { color: #F8B26A; font-weight: 700; }
  .bar .ok { color: #9FE0A8; font-weight: 700; }

  .pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 0 48px; }
  .page { width: 210mm; height: 297mm; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgba(18,28,58,.15); padding: 16mm 20mm 12mm; display: flex; flex-direction: column; font: 12pt/1.5 var(--d); color: var(--g); position: relative; }
  .page.over { outline: 3px solid #E4237A; }
  .page.over::after { content: 'Conteúdo excede a página — reduza os textos'; position: absolute; top: 4mm; right: 4mm; background: #E4237A; color: #fff; font: 700 9pt Arial; padding: 1mm 3mm; border-radius: 2mm; }
  .body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .pages { padding: 0; gap: 0; display: block; }
    .page { box-shadow: none; outline: none !important; page-break-after: always; break-after: page; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .page.over::after { display: none; }
  }
  p { margin: 0; }

  /* Cabeçalho e rodapé das laudas */
  .ph-top { flex: none; display: flex; justify-content: space-between; align-items: center; padding-bottom: 2mm; }
  .ph-top .s { font: 700 12pt/1.5 var(--d); letter-spacing: .06em; text-transform: uppercase; color: var(--a); }
  .ph-top img { height: 11mm; width: auto; display: block; }
  .faixa { flex: none; height: 1.4mm; background: var(--faixa); margin-bottom: 6mm; }
  .foot { flex: none; display: flex; justify-content: space-between; gap: 6mm; font-size: 12pt; color: var(--m); padding-top: 3mm; border-top: .75pt solid var(--l2); }
  h2 { margin: 0 0 2mm; font: 700 14pt/1.5 var(--d); color: var(--g); }

  /* Integrantes */
  .mem { border: .75pt solid var(--l); border-top: 1.4mm solid var(--c); border-radius: 3mm; padding: 4mm 5mm; display: grid; grid-template-columns: 26mm 1fr; gap: 2mm 5mm; }
  .mem + .mem { margin-top: 4mm; }
  .mem .pic { width: 26mm; height: 32mm; border-radius: 2mm; overflow: hidden; background: var(--cz); }
  .mem .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { background: repeating-linear-gradient(135deg, var(--l2) 0 2mm, #fff 2mm 4mm); display: flex; align-items: center; justify-content: center; font: 12pt/1.5 var(--d); color: var(--m); text-align: center; }
  .mem .id { align-self: end; }
  .mem .id b { display: block; font: 700 12pt/1.5 var(--d); color: var(--c); }
  .mem .nm { font: 700 13pt/1.5 var(--d); }
  .mem .l1 { font-weight: 700; }
  .mem .l1.frase { font-style: italic; }
  .mem .rest { grid-column: 1 / -1; }
  .meta { color: var(--m); }
  .tags { margin: 1.2mm 0; display: flex; flex-wrap: wrap; gap: 1.2mm; }
  .tags span { padding: 0 2.5mm; border: .9pt solid var(--g); border-radius: 3mm; font-size: 12pt; line-height: 1.5; }
  .txt { padding-top: 1.5mm; border-top: .75pt solid var(--l2); text-align: justify; }

  /* Quem somos */
  .mvv { margin: 4mm 0 5mm; background: var(--g); color: #fff; border-radius: 3mm; padding: 4mm 5mm; display: grid; grid-template-columns: 1fr 1fr; gap: 2mm 6mm; }
  .mvv strong { display: block; color: var(--ceu); }
  .mvv p { color: #D5DAE6; }
  .mvv .val { grid-column: 1 / -1; }
  .pills { display: flex; flex-wrap: wrap; gap: 1.5mm; margin-top: 1mm; }
  .pills span { padding: 0 3mm; border: .9pt solid #fff; border-radius: 3mm; }

  /* Mapa */
  .rd { display: grid; grid-template-columns: 1fr 52mm; gap: 4mm; align-items: center; }
  .rd-fig svg { display: block; width: 100%; height: auto; }
  .rd-leg { display: flex; flex-direction: column; gap: 1.5mm; }
  .rd-leg span { display: flex; align-items: center; gap: 2.5mm; }
  .rd-leg i { flex: none; width: 8mm; height: 1mm; border-radius: .5mm; background: var(--c); }
  .rd-esc { margin-top: 2mm; padding-top: 2mm; border-top: .75pt solid var(--l); color: var(--m); }
  .rd-esc b { color: var(--g); }
  .mx { display: grid; grid-template-columns: 1fr repeat(var(--n, 4), 11mm); }
  .mx > span { border-bottom: .5pt solid var(--l); padding: .6mm 0; display: flex; align-items: center; }
  .mx > span.h { border-bottom: 1pt solid var(--g); font-weight: 700; color: var(--m); align-items: end; }
  .mx > span.c { justify-content: center; }
  .mx > span.h.c { flex-direction: column; color: var(--c); }
  .mx .av { width: 8mm; height: 8mm; border-radius: 50%; overflow: hidden; border: .9pt solid var(--c); }
  .mx .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .d2 { width: 3.8mm; height: 3.8mm; border-radius: 50%; background: var(--a); }
  .d1 { width: 3.8mm; height: 3.8mm; border-radius: 50%; border: .9pt solid var(--a); background: linear-gradient(90deg, var(--a) 0 50%, #fff 50% 100%); }
  .d0 { width: 1mm; height: 1mm; border-radius: 50%; background: var(--l); }

  /* Competências e vivências */
  .sk { border-left: 1.4mm solid var(--c); padding: 1mm 0 1mm 4mm; }
  .sk + .sk { margin-top: 3mm; }
  .sk .t { font-weight: 700; }
  .sk .q { color: var(--m); }
  .trip { padding: 1mm 0 1mm 4mm; border-left: 1.4mm solid var(--c); }
  .trips { display: grid; grid-template-columns: 1fr 1fr; gap: 2mm 5mm; }
  .trip .k { font-weight: 700; }
  .trip .k span { color: var(--c); }
  .vazio { color: var(--m); }

  /* Caso e fechamento */
  .step { display: grid; grid-template-columns: 30mm 1fr; gap: 4mm; align-items: baseline; }
  .step + .step { margin-top: 2mm; }
  .step b { color: var(--c); }
  .closing { margin-top: 6mm; background: var(--g); color: #fff; border-radius: 3mm; padding: 5mm 6mm; }
  .closing .phrase { font: 700 18pt/1.5 var(--d); }
  .closing .phrase span { color: #F08A1C; }
  .decl { margin-top: 3mm; background: #fff; color: var(--g); border-radius: 2mm; padding: 3mm 4mm; }
  .decl .names { margin-top: 1.5mm; display: grid; grid-template-columns: 1fr 1fr; gap: 0 8mm; font-weight: 700; }
  .decl .names span { border-bottom: .9pt solid var(--c); }

  /* Capa */
  .cover { padding: 0; flex-direction: row; }
  .rail { flex: none; width: 12mm; background: var(--g); display: flex; flex-direction: column; justify-content: flex-end; }
  .rail span { height: 45%; background: linear-gradient(180deg, #1F5FD6, #13A3AF, #6CC24A, #F08A1C, #E4237A); }
  .cv { flex: 1; padding: 20mm 18mm 16mm; display: flex; flex-direction: column; }
  .cv-top { display: flex; justify-content: space-between; font-size: 12pt; color: var(--m); }
  .cv-top b { color: var(--a); letter-spacing: .06em; text-transform: uppercase; }
  .cv-logo { margin-top: 18mm; display: flex; flex-direction: column; align-items: center; gap: 3mm; padding: 10mm 0; background: var(--cz); border-radius: 4mm; }
  .cv-logo img { width: 70mm; height: auto; display: block; }
  .cv-logo p { color: var(--texto, #3A3E46); }
  .cv h1 { margin: 14mm 0 0; font: 700 24pt/1.5 var(--d); }
  .cv h1 span { color: var(--a); }
  .cv-bar { margin-top: 4mm; width: 45mm; height: 2mm; background: var(--faixa); }
  .cv-people { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 5mm 8mm; }
  .cv-person { display: flex; gap: 4mm; align-items: center; }
  .cv-person .av { flex: none; width: 17mm; height: 17mm; border-radius: 50%; overflow: hidden; border: 1pt solid var(--c); background: var(--cz); }
  .cv-person .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cv-person b { display: block; color: var(--c); }
</style>
</head>
<body>
<div class="bar">
  <button type="button" id="baixarPpt" onclick="window.AUTH_PPT.gerar(this)">Baixar PPT</button>
  <button type="button" class="sec" id="baixar">Baixar PDF</button>
  <button type="button" class="sec" onclick="window.print()" title="Na janela de impressão: Margens Nenhuma, sem cabeçalhos e rodapés, com gráficos de fundo">Imprimir</button>
  <span>Baixar PDF gera o arquivo igual à tela, sem margens nem cabeçalho do navegador.</span>
  <span id="check">Verificando páginas…</span>
  <a href="index.html">← Portfólio web</a>
</div>
<div class="pages" id="pages"></div>

<script>
(async function () {
  const { C, esc, loadTeam, derive } = window.AUTH;
  const { membros, demo } = await loadTeam();
  const D = derive(membros);
  const TOTAL = 5;
  const titulo = 'Portfólio da Equipe AUTH – Processo Seletivo Argo Menthor';
  const short = n => { const w = String(n).split(' '); return w.length > 2 ? w[0] + ' ' + w[w.length - 1] : n; };
  const img = (m, cls = '') => m.foto ? `<img src="${esc(m.foto)}" alt="" style="object-position:${esc(m.pos || '50% 20%')}">` : '';

  const page = (i, label, html) => `
    <section class="page">
      <div class="ph-top"><span class="s">${label}</span><img src="assets/logo-auth.png" alt="AUTH"></div>
      <div class="faixa"></div>
      <div class="body">${html}</div>
      <div class="foot"><span>${titulo}</span><span>${i} / ${TOTAL}</span></div>
    </section>`;

  const mem = m => {
    const l1 = m.frase ? `<div class="l1 frase">${esc(m.frase)}</div>` : `<div class="l1">${esc([m.cargo, m.empresa].filter(Boolean).join(' · '))}</div>`;
    const l2 = (m.frase ? [m.cargo, m.empresa, m.formacao] : [m.formacao]).filter(Boolean).join(' · ');
    return m.pendente ? `
    <div class="mem" style="--c:${m.cor}">
      <div class="pic ph">foto</div>
      <div class="id"><div class="nm">${esc(m.nome)}</div><div class="vazio">[Aguardando preenchimento]</div></div>
    </div>` : `
    <div class="mem" style="--c:${m.cor}">
      <div class="pic${m.foto ? '' : ' ph'}">${m.foto ? img(m) : 'foto'}</div>
      <div class="id"><div class="nm">${esc(m.nome)}</div>${l1}${l2 ? `<div class="meta">${esc(l2)}</div>` : ''}</div>
      <div class="rest">
        <div class="tags">${m.skills.map(s => `<span>${esc(s)}</span>`).join('')}</div>
        <p class="txt">${esc(m.contrib)}</p>
      </div>
    </div>`;
  };

  const cover = `
    <section class="page cover">
      <div class="rail"><span></span></div>
      <div class="cv">
        <div class="cv-top"><b>MBA Online FGV · ${esc(C.DISCIPLINA)}</b><span>${esc(C.DATA)}</span></div>
        <div class="cv-logo"><img src="assets/logo-auth.png" alt="AUTH"><p>${esc(C.SLOGAN || '')}</p></div>
        <h1>Portfólio da Equipe <span>AUTH</span> – Processo Seletivo Argo Menthor</h1>
        <div class="cv-bar"></div>
        <div class="cv-people">
          ${membros.map(m => `<div class="cv-person" style="--c:${m.cor}"><span class="av">${img(m)}</span><div>${esc(m.nome)}</div></div>`).join('')}
        </div>
      </div>
    </section>`;

  const p1 = page(1, '01 · Quem somos', `
    <h2>Quem somos</h2>
    <p style="text-align:justify">${esc(C.MANIFESTO)}</p>
    <div class="mvv">
      <div><strong>Missão</strong><p>${esc(C.MISSAO || '')}</p></div>
      <div><strong>Visão</strong><p>${esc(C.VISAO || '')}</p></div>
      <div class="val"><strong>Valores</strong><div class="pills">${(C.VALORES || []).map(v => `<span>${esc(v)}</span>`).join('')}</div></div>
    </div>
    <h2>Integrantes</h2>
    ${membros.slice(0, 1).map(mem).join('')}`);

  const p2 = page(2, '02 · Integrantes', membros.slice(1, 4).map(mem).join(''));

  const c = D.caso;
  const stepCor = ['#1F5FD6', '#13A3AF', '#F08A1C', '#E4237A'];
  const p3 = page(3, '03 · Integrantes · Complementaridade · Caso real', `
    ${membros.slice(4).map(mem).join('')}
    <h2 style="margin-top:5mm">Mapa de complementaridade</h2>
    <div class="rd">
      <div class="rd-fig">${AUTH.radar(D, membros, { font: 40, ticks: false, centro: false })}</div>
      <div class="rd-leg">
        ${membros.map(m => `<span style="--c:${m.cor}"><i></i>${esc(short(m.nome))}</span>`).join('')}
        <div class="rd-esc"><b>2</b> especialista · <b>1</b> apoio · <b>0</b> sem atuação</div>
      </div>
    </div>
    <h2 style="margin-top:5mm">Caso real em destaque</h2>
    ${c ? `
      <div style="margin:0 0 3mm;color:var(--m)">${esc(c.titulo)} · ${esc(c.quem)}${c.soft ? ' · ' + esc(c.soft.label) : ''}${c.meta ? ' · ' + esc(c.meta) : ''}</div>
      ${c.passos.map((p, i) => `<div class="step" style="--c:${stepCor[i % 4]}"><b>${String(i + 1).padStart(2, '0')} ${p[0]}</b><span style="text-align:justify">${esc(p[1])}</span></div>`).join('')}`
      : '<p class="vazio" style="margin:1mm 0">[Aguardando um caso real: contexto → desafio → ação → resultado]</p>'}`);

  const comTrip = new Set(D.trips.map(t => t.nome));
  const faltam = membros.filter(m => !comTrip.has(m.nome)).map(m => short(m.nome));
  const p4 = page(4, '04 · Competências', `
    <h2>As 4 competências</h2>
    ${D.skills.map(k => `
      <div class="sk" style="--c:${k.cor}">
        <div class="t">${k.n} · ${esc(k.label)}</div>
        <div class="q">${k.quem.length ? esc(k.quem.join(' · ')) : '[Sem integrante ainda]'}</div>
        ${k.ev.length ? k.ev.map(v => `<p style="text-align:justify">“${esc(v.txt)}” <strong>— ${esc(short(v.quem))}</strong></p>`).join('') : '<p class="vazio">[Exemplo a preencher pelo integrante no formulário]</p>'}
      </div>`).join('')}`);

  const viv = `
    <h2 style="margin:0">Vivência multicultural</h2>
    ${C.ONDE_ESTAMOS ? `<p style="margin-bottom:2mm"><strong>Onde estamos:</strong> ${esc(C.ONDE_ESTAMOS)}</p>` : ''}
    <div class="trips">${D.trips.map(t => { const m = membros.find(x => x.nome === t.nome) || {}; return `
      <div class="trip" style="--c:${m.cor}">
        <div class="k">${esc(t.periodo)} · ${esc(t.local)} <span>· ${t.intl ? 'Internacional' : 'Nacional'} · ${esc(short(t.nome))}</span></div>${esc(t.texto)}
      </div>`; }).join('')}</div>
    ${faltam.length ? `<p class="vazio" style="margin-top:2mm">[Aguardando vivências de: ${esc(faltam.join(', '))}]</p>` : ''}`;

  const p5 = page(5, '05 · Vivências · Fechamento', `${viv}
    <div class="closing">
      <p class="phrase">${esc(C.FRASE_FINAL)}<span>.</span></p>
      <div class="decl">
        <p>A equipe AUTH informa que os integrantes a seguir colaboraram efetivamente na realização do desafio:</p>
        <div class="names">${C.INTEGRANTES.map((n, i) => `<span style="--c:${(C.CORES || [])[i] || '#121C3A'}">${esc(n)}</span>`).join('')}</div>
      </div>
    </div>`);

  document.getElementById('pages').innerHTML = cover + p1 + p2 + p3 + p4 + p5;

  // Verifica estouro de conteúdo em cada página (depois de fontes e fotos carregarem)
  async function check() {
    try { await document.fonts.ready; } catch (e) {}
    await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
    const over = [];
    document.querySelectorAll('.page').forEach((pg, i) => {
      const b = pg.querySelector('.body');
      const isOver = b && b.scrollHeight > b.clientHeight + 1;
      pg.classList.toggle('over', !!isOver);
      if (isOver) over.push(i);
    });
    const el = document.getElementById('check');
    el.className = over.length ? 'w' : 'ok';
    el.textContent = (demo ? 'Modo demonstração · ' : '') + (over.length
      ? `Página ${over.join(', ')} excede o espaço — encurte os textos dessa parte.`
      : 'Capa + 5 páginas, todas dentro do limite ✓');
  }
  check();

  // ---------- Baixar PDF: cada folha A4 vira uma página, exatamente como na tela ----------
  const loadScript = src => new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => fail(new Error('Não foi possível carregar ' + src)); document.head.appendChild(sc); });
  // Fotos do Google Drive não podem ser capturadas direto (outro domínio): pedimos ao backend em base64.
  async function fotosLocais() {
    const imgs = [...document.querySelectorAll('#pages img')].filter(im => /drive\.google\.com\/thumbnail/.test(im.src));
    const cache = {};
    await Promise.all(imgs.map(async im => {
      const id = new URL(im.src).searchParams.get('id');
      try {
        cache[id] = cache[id] || fetch(C.API_URL + '?action=foto&id=' + encodeURIComponent(id)).then(r => r.json());
        const r = await cache[id];
        if (r.ok) await new Promise(ok => { im.onload = im.onerror = ok; im.src = r.data; });
      } catch (e) { /* mantém a imagem original */ }
    }));
  }
  document.getElementById('baixar').addEventListener('click', async e => {
    const btn = e.currentTarget, el = document.getElementById('check'), antes = el.textContent;
    btn.disabled = true; btn.textContent = 'Gerando…';
    try {
      if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      el.textContent = 'Preparando fotos…';
      await fotosLocais();
      document.body.classList.add('capturando');
      const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
      const pages = [...document.querySelectorAll('.page')];
      for (let i = 0; i < pages.length; i++) {
        el.textContent = `Gerando página ${i + 1} de ${pages.length}…`;
        const canvas = await window.html2canvas(pages[i], { scale: 3, useCORS: true, backgroundColor: '#ffffff', logging: false });
        if (i) pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
      }
      pdf.setProperties({ title: titulo, author: 'Equipe AUTH' });
      pdf.save('Portfolio_Equipe_AUTH.pdf');
      el.textContent = antes;
    } catch (err) {
      el.className = 'w'; el.textContent = 'Erro ao gerar o PDF: ' + (err.message || err) + ' — use Imprimir.';
    } finally {
      document.body.classList.remove('capturando');
      btn.disabled = false; btn.textContent = 'Baixar PDF';
    }
  });
})();
</script>
</body>
</html>
