<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio AUTH · PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231D2026'/%3E%3Crect x='19' y='19' width='7' height='7' fill='%232F7A5F'/%3E%3C/svg%3E">
<script src="config.js"></script>
<script src="assets/auth.js"></script>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  :root { --g: #1D2026; --m: #5A5E66; --l: #D8D4CB; --v: #2F7A5F; --a: #3C67A3; --t: #B65A3C; --d: Arial, Helvetica, sans-serif; }
  html, body { margin: 0; }
  body { background: #E9E6DF; color: var(--g); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 12px 20px; background: var(--g); color: #fff; font: 14px/1.4 Arial, sans-serif; }
  .bar button { border: 0; border-radius: 8px; padding: 10px 18px; background: var(--v); color: #fff; font: 700 15px var(--d); cursor: pointer; }
  .bar a { color: #fff; }
  .bar .w { color: #F2B8A5; font-weight: 700; }
  .bar .ok { color: #9FD6BF; font-weight: 700; }

  .pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 0 48px; }
  .page { width: 210mm; height: 297mm; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgba(29,32,38,.15); padding: 20mm 22mm 14mm; display: flex; flex-direction: column; font: 12pt/1.5 Arial, Helvetica, sans-serif; position: relative; }
  .page.over { outline: 3px solid var(--t); }
  .page.over::after { content: 'Conteúdo excede a página — reduza os textos'; position: absolute; top: 4mm; right: 4mm; background: var(--t); color: #fff; font: 700 9pt Arial; padding: 1mm 3mm; border-radius: 2mm; }
  .body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  @media print {
    body { background: #fff; }
    .bar { display: none; }
    .pages { padding: 0; gap: 0; display: block; }
    .page { box-shadow: none; outline: none !important; page-break-after: always; break-after: page; }
    .page:last-child { page-break-after: auto; break-after: auto; }
    .page.over::after { display: none; }
  }

  .logo { display: inline-flex; align-items: baseline; font: 800 14pt/1.5 var(--d); letter-spacing: -0.04em; }
  .logo i { display: inline-block; width: .2em; height: .2em; background: var(--v); margin-left: .06em; }
  .ph-top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: .75pt solid var(--l); padding-bottom: 2mm; margin-bottom: 6mm; flex: none; }
  .ph-top span.s { font-size: 12pt; color: var(--m); }
  .foot { flex: none; display: flex; justify-content: space-between; gap: 6mm; font-size: 12pt; color: var(--m); padding-top: 3mm; }
  h2 { margin: 0 0 2mm; font: 700 14pt/1.5 var(--d); }
  p { margin: 0; }

  .mem { display: grid; grid-template-columns: 28mm 1fr; gap: 6mm; padding-top: 3.5mm; border-top: .75pt solid var(--l); }
  .mem + .mem { margin-top: 4mm; }
  .mem .pic { height: 35mm; border: .75pt solid var(--l); overflow: hidden; }
  .mem .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { background: repeating-linear-gradient(135deg, #ECE9E2 0 2mm, #fff 2mm 4mm); display: flex; align-items: center; justify-content: center; font: 12pt/1.5 Arial, sans-serif; color: var(--m); text-align: center; }
  .mem .nm { font: 700 13pt/1.5 var(--d); }
  .mem .nm b { color: var(--v); }
  .meta { font-size: 12pt; line-height: 1.5; color: #3A3E46; }
  .tags { margin: 1.5mm 0; display: flex; flex-wrap: wrap; gap: 1.5mm; }
  .tags span { padding: 0 2.5mm; border: .75pt solid var(--g); border-radius: 3mm; font-size: 12pt; line-height: 1.5; }

  .mx { display: grid; grid-template-columns: 1fr repeat(var(--n, 5), 12mm); font-size: 12pt; line-height: 1.5; }
  .mx > span { border-bottom: .5pt solid var(--l); padding: .4mm 0; display: flex; align-items: center; }
  .mx > span.h { border-bottom: 1pt solid var(--g); font-weight: 700; color: var(--m); }
  .mx > span.c { justify-content: center; }
  .mx > span.h.c { font: 800 12pt/1.5 var(--d); color: var(--g); }
  .d2 { width: 3.6mm; height: 3.6mm; border-radius: 50%; background: var(--v); }
  .d1 { width: 3.6mm; height: 3.6mm; border-radius: 50%; border: .9pt solid var(--v); }
  .d0 { width: 1mm; height: 1mm; border-radius: 50%; background: #B8B3A8; }
  .trip { padding: 1mm 0 1mm 5mm; border-left: 1.5pt solid var(--c); }
  .trip + .trip { margin-top: 2mm; }
  .trip .k { font-size: 12pt; line-height: 1.5; font-weight: 700; color: var(--c); }

  .sk { border-top: .75pt solid var(--l); padding-top: 2.5mm; }
  .sk + .sk { margin-top: 4mm; }
  .sk .t { display: flex; align-items: center; gap: 3mm; font: 700 12pt/1.5 var(--d); }
  .sk .t i { flex: none; width: 3.5mm; height: 3.5mm; }
  .sk p { margin-top: 1mm; padding-left: 6.5mm; }
  .sk p strong { font-size: 12pt; }

  .step { display: grid; grid-template-columns: 26mm 1fr; gap: 4mm; align-items: baseline; }
  .step + .step { margin-top: 2.5mm; }
  .step b { font: 800 12pt/1.5 var(--d); }
</style>
</head>
<body>
<div class="bar">
  <button type="button" onclick="window.print()">Exportar PDF</button>
  <span>Na janela de impressão: <b>Destino: Salvar como PDF</b> · <b>Margens: Nenhuma</b> · ative <b>Gráficos de fundo</b>.</span>
  <span id="check">Verificando páginas…</span>
  <a href="index.html">← Portfólio web</a>
</div>
<div class="pages" id="pages"></div>

<script>
(async function () {
  const { C, esc, loadTeam, derive } = window.AUTH;
  const { membros, demo } = await loadTeam();
  const D = derive(membros);
  const TOTAL = 5;
  const titulo = 'Portfólio da Equipe AUTH – Processo Seletivo Argo Menthor';
  const short = n => { const w = String(n).split(' '); return w.length > 2 ? w[0] + ' ' + w[w.length - 1] : n; };
  const logo = s => `<span class="logo"${s ? ` style="font-size:${s}"` : ''}>AUTH<i></i></span>`;

  const page = (i, label, html) => `
    <section class="page">
      <div class="ph-top">${logo()}<span class="s">${label}</span></div>
      <div class="body">${html}</div>
      <div class="foot"><span>${titulo}</span><span>${i} / ${TOTAL}</span></div>
    </section>`;

  const mem = m => m.pendente ? `
    <div class="mem"><div class="pic ph">foto ${m.n}</div>
      <div><div class="nm"><b>${m.n}</b>  ${esc(m.nome)}</div><p style="color:var(--m)">[Aguardando preenchimento]</p></div></div>` : `
    <div class="mem">
      <div class="pic${m.foto ? '' : ' ph'}">${m.foto ? `<img src="${esc(m.foto)}" alt="">` : 'foto ' + m.n}</div>
      <div>
        <div class="nm"><b>${m.n}</b>  ${esc(m.nome)}</div>
        <div class="meta">${esc([m.cargo, m.empresa].filter(Boolean).join(' · '))}<br>${esc(m.formacao)}</div>
        <div class="tags">${m.skills.map(s => `<span>${esc(s)}</span>`).join('')}</div>
        <p>${esc(m.contrib)}</p>
      </div>
    </div>`;

  const cover = `
    <section class="page" style="padding:22mm 20mm 16mm">
      <div style="display:flex;justify-content:space-between;font-size:12pt;color:var(--m)"><span>MBA Online FGV · ${esc(C.DISCIPLINA)}</span><span>${esc(C.DATA)}</span></div>
      <div style="margin-top:46mm">${logo('72pt')}</div>
      <div style="margin-top:4mm;font-size:12pt;color:var(--m)">de autoria · autenticidade · autoridade</div>
      <h1 style="margin:18mm 0 0;font:700 24pt/1.5 var(--d);max-width:160mm">${titulo}</h1>
      <div style="margin-top:auto;border-top:1.5pt solid var(--g);padding-top:5mm">
        <div style="font:700 12pt/1.5 var(--d);color:var(--v)">Integrantes</div>
        <ol style="margin:2mm 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;column-gap:10mm">
          ${membros.map(m => `<li><strong style="font-family:var(--d);color:var(--v)">${m.n}</strong>  ${esc(m.nome)}</li>`).join('')}
        </ol>
      </div>
      <div style="margin-top:8mm;display:flex;gap:1.5mm;height:2mm"><span style="flex:1;background:var(--a)"></span><span style="flex:1;background:var(--t)"></span><span style="flex:1;background:var(--v)"></span><span style="flex:1;background:var(--g)"></span></div>
    </section>`;

  const p1 = page(1, 'Quem somos · Integrantes', `
    <h2>Quem somos</h2>
    <p style="margin-bottom:6mm">${esc(C.MANIFESTO)}</p>
    <h2 style="margin-bottom:1mm">Integrantes</h2>
    ${membros.slice(0, 2).map(mem).join('')}`);

  const p2 = page(2, 'Integrantes (continuação)', membros.slice(2).map(mem).join('').replace('class="mem"', 'class="mem" style="border-top:0;padding-top:0"'));

  const p3 = page(3, 'Complementaridade · Vivência multicultural', `
    <h2>Mapa de complementaridade</h2>
    <div class="mx" style="--n:${membros.length}">
      <span class="h">Área · unidade Argo Menthor</span>${membros.map(m => `<span class="h c">${m.n}</span>`).join('')}
      ${D.matrix.map(r => `<span><span><strong>${esc(r.area)}</strong> <span style="color:var(--m)">· ${esc(r.bu)}</span></span></span>${r.cells.map(c => `<span class="c"><span class="d${c}"></span></span>`).join('')}`).join('')}
    </div>
    <div style="margin:1.5mm 0 4mm;font-size:12pt;color:var(--m)">● especialista   ○ apoio   · sem atuação   —   ${membros.map(m => `${m.n} ${esc(m.nome.split(' ')[0])}`).join(' · ')}</div>
    <h2>Vivência multicultural</h2>
    ${D.trips.length ? D.trips.map(t => `
      <div class="trip" style="--c:${t.intl ? 'var(--a)' : 'var(--v)'}">
        <div class="k"><span style="color:var(--g)">${esc(t.periodo)} · ${esc(t.local)}</span>  ${t.intl ? 'Internacional' : 'Nacional'} · ${esc(short(t.nome))}</div>${esc(t.texto)}
      </div>`).join('') : '<p style="color:var(--m)">[Aguardando vivências]</p>'}`);

  const p4 = page(4, 'As 4 competências', `
    <h2 style="margin-bottom:4mm">As 4 competências</h2>
    ${D.skills.map(k => `
      <div class="sk">
        <div class="t"><i style="background:${k.cor}"></i>${k.n} · ${esc(k.label)}</div>
        ${k.ev.length ? k.ev.map(v => `<p>${esc(v.txt)} <strong>— ${esc(short(v.quem))}</strong></p>`).join('') : '<p style="color:var(--t)">[Sem evidência ainda]</p>'}
      </div>`).join('')}`);

  const c = D.caso;
  const p5 = page(5, 'Caso real · Fechamento', `
    <h2 style="margin:0">Caso real em destaque</h2>
    ${c ? `
      <div style="margin:1mm 0 4mm;font-size:12pt;color:var(--m)">${esc(c.titulo)} · ${esc(c.quem)}${c.soft ? ' · ' + esc(c.soft.label) : ''}${c.meta ? ' · ' + esc(c.meta) : ''}</div>
      ${c.passos.map((p, i, a) => `<div class="step"><b style="color:${i === a.length - 1 ? 'var(--v)' : 'var(--g)'}">${String(i + 1).padStart(2, '0')} ${p[0]}</b><span>${esc(p[1])}</span></div>`).join('')}`
      : '<p style="margin:2mm 0;color:var(--t)">[Aguardando um caso real]</p>'}
    <p style="margin:6mm 0 0;font:800 18pt/1.5 var(--d)">${esc(C.FRASE_FINAL)}<span style="color:var(--v)">.</span></p>
    <div style="margin-top:5mm;padding:4mm 5mm;border:1pt solid var(--g)">
      <p>A equipe AUTH informa que os integrantes a seguir colaboraram efetivamente na realização do desafio:</p>
      <p style="margin-top:2mm;font-weight:700">${C.INTEGRANTES.map(esc).join(' · ')}</p>
    </div>`);

  document.getElementById('pages').innerHTML = cover + p1 + p2 + p3 + p4 + p5;

  // Verifica estouro de conteúdo em cada página (depois de fontes e fotos carregarem)
  async function check() {
    try { await document.fonts.ready; } catch (e) {}
    await Promise.all([...document.images].map(img => img.complete ? 0 : new Promise(r => { img.onload = img.onerror = r; })));
    const over = [];
    document.querySelectorAll('.page').forEach((pg, i) => {
      const b = pg.querySelector('.body');
      const isOver = b && b.scrollHeight > b.clientHeight + 1;
      pg.classList.toggle('over', !!isOver);
      if (isOver) over.push(i);
    });
    const el = document.getElementById('check');
    el.className = over.length ? 'w' : 'ok';
    el.textContent = (demo ? 'Modo demonstração · ' : '') + (over.length
      ? `Página ${over.join(', ')} excede o espaço — encurte os textos dessa parte.`
      : 'Capa + 5 páginas, todas dentro do limite ✓');
  }
  check();
})();
</script>
</body>
</html>
