<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio da Equipe AUTH</title>
<meta name="description" content="Portfólio da Equipe AUTH – Processo Seletivo Argo Menthor · MBA Online FGV">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261019e">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<script src="config.js?v=20261019e"></script>
<script src="assets/auth.js?v=20261019e"></script>
<script src="assets/ppt.js?v=20261019e"></script>
</head>
<body>
<div id="app"><div class="loading">Carregando o portfólio…</div></div>

<script>
(async function () {
  const { C, esc, logo, loadTeam, derive } = window.AUTH;
  const { membros, demo, error } = await loadTeam();
  const D = derive(membros);
  const S = D.stats;
  const first = n => String(n).split(' ')[0];
  const short = n => { const w = String(n).split(' '); return w.length > 2 ? w[0] + ' ' + w[w.length - 1] : n; };

  const foto = (m, label) => m.foto
    ? `<img class="foto" src="${esc(m.foto)}" alt="Foto de ${esc(m.nome)}" style="object-position:${esc(m.pos || '50% 20%')}" loading="lazy">`
    : `<div class="ph" style="width:100%;height:100%">${esc(label)}</div>`;
  const avatar = m => `<span class="avatar">${m.foto ? `<img src="${esc(m.foto)}" alt="" style="object-position:${esc(m.pos || '50% 20%')}">` : ''}</span>`;

  // Barra de status (some na impressão; não faz parte do portfólio)
  const pend = membros.filter(m => m.fonte !== 'form').map(m => first(m.nome));
  const semEv = D.skills.filter(k => !k.ev.length).map(k => k.label);
  const status = demo
    ? `<div class="status demo"><strong>Modo demonstração</strong><span>Dados de exemplo. Configure <code>API_URL</code> em config.js para ler a planilha.</span><a href="formulario.html">Formulário →</a></div>`
    : `<div class="status">
        <span class="pill">${S.preenchidos}/${membros.length} perfis no portfólio</span>
        ${pend.length ? `<span>Formulário pendente: ${esc(pend.join(', '))}</span>` : '<span>Todos preencheram o formulário ✓</span>'}
        ${semEv.length ? `<span class="warn">Sem evidência: ${esc(semEv.join(' · '))}</span>` : ''}
        ${D.caso ? '' : '<span class="warn">Nenhum caso real ainda</span>'}
        ${error ? `<span class="warn">Erro ao ler a planilha: ${esc(error)}</span>` : ''}
        <a href="formulario.html">Formulário →</a>
      </div>`;

  const nav = `
  <nav class="nav">
    <div class="nav-in">
      ${logo()}
      <div class="nav-links">
        <a href="#integrantes">Integrantes</a><a href="#mapa">Complementaridade</a><a href="#vivencias">Vivências</a>
        <a href="#competencias">Competências</a><a href="#caso">Caso real</a>
        <a class="acc" href="#" id="baixarPpt">Apresentação (PPT) ↓</a>
      </div>
    </div>
    <div class="faixa"></div>
  </nav>`;

  const cover = `
  <header class="cover">
    <div class="cover-rail"><span></span></div>
    <div class="cover-main">
      <span class="eyebrow">MBA Online FGV · ${esc(C.DISCIPLINA)}</span>
      <h1>Portfólio da Equipe <span>AUTH</span> – Processo Seletivo Argo Menthor</h1>
      <div class="cover-bar"></div>
      <div class="cover-people">
        ${membros.map(m => `
          <div class="cover-person" style="--c:${m.cor}">
            ${avatar(m)}
            <div><strong>${esc(m.nome)}</strong></div>
          </div>`).join('')}
      </div>
    </div>
    <div class="cover-side">
      <img src="assets/logo-auth.png" alt="AUTH">
      <p>${esc(C.SLOGAN || '')}</p>
    </div>
  </header>`;

  const manifesto = `
  <section class="manifesto">
    <div>
      <span class="eyebrow">Quem somos</span>
      <p class="big">${esc(C.MANIFESTO)}</p>
    </div>
  </section>
  <section class="mvv">
    <div>
      <div><strong>Missão</strong><p>${esc(C.MISSAO || '')}</p></div>
      <div><strong>Visão</strong><p>${esc(C.VISAO || '')}</p></div>
      <div><strong>Valores</strong><div class="pills">${(C.VALORES || []).map(v => `<span>${esc(v)}</span>`).join('')}</div></div>
    </div>
  </section>`;

  const linha1 = m => m.frase
    ? `<strong class="frase">${esc(m.frase)}</strong>`
    : `<strong>${esc([m.cargo, m.empresa].filter(Boolean).join(' · '))}</strong>`;
  const linha2 = m => esc((m.frase ? [m.cargo, m.empresa, m.formacao] : [m.formacao]).filter(Boolean).join(' · '));

  const cards = `
  <section id="integrantes" class="block cinza">
    <div style="margin-bottom:36px"><span class="eyebrow">01 · Integrantes</span><h2 class="h2">Cinco autores, uma assinatura</h2></div>
    <div class="cards">
      ${membros.map(m => m.pendente ? `
        <article class="card pend" style="--c:${m.cor}">
          <div class="card-body">
            <div class="card-top"><div class="card-photo">${foto(m, 'aguardando foto')}</div><div class="card-id"><h3>${esc(m.nome)}</h3></div></div>
            <span class="pend-note">Aguardando preenchimento do formulário.</span>
          </div>
        </article>` : `
        <article class="card" style="--c:${m.cor}">
          <div class="card-body">
            <div class="card-top">
              <div class="card-photo">${foto(m, 'foto')}</div>
              <div class="card-id"><h3>${esc(m.nome)}</h3>${linha1(m)}</div>
            </div>
            <span class="card-sub">${linha2(m)}</span>
            <div class="tags">${m.skills.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>
            <p class="card-contrib">${esc(m.contrib)}</p>
          </div>
        </article>`).join('')}
    </div>
  </section>`;

  const matrix = `
  <section id="mapa" class="split">
    <div class="split-main">
      <span class="eyebrow">02 · Mapa de complementaridade</span>
      <h2 class="h2" style="margin-bottom:32px">Nenhuma frente descoberta</h2>
      <div class="radar-box">
        <div class="radar-fig">${window.AUTH.radar(D, membros, { font: 21 })}</div>
        <div class="radar-leg">
          <b class="leg-t">Integrantes</b>
          ${membros.map(m => `<span class="leg-m" style="--c:${m.cor}"><i></i>${esc(m.nome)}</span>`).join('')}
          <div class="leg-escala"><b class="leg-t">Escala do mapa</b><span><em>2</em>Especialista</span><span><em>1</em>Apoio</span><span><em>0</em>Sem atuação</span></div>
        </div>
      </div>
    </div>
    <div class="split-side">
      <h3>As 4 competências</h3>
      ${D.skills.map(k => `
        <a class="soft-link" href="#competencias" style="--c:${k.cor}">
          <strong>${esc(k.label)}</strong>
          ${k.quem.length ? `<span>${esc(k.quem.join(' · '))}</span>` : '<span class="vazio">[Sem integrante ainda]</span>'}
        </a>`).join('')}
    </div>
  </section>`;

  // Vivências: as preenchidas + um espaço para cada integrante que ainda não enviou
  const comTrip = new Set(D.trips.map(t => t.nome));
  const trips = `
  <section id="vivencias" class="block cinza">
    <div class="block-head">
      <div><span class="eyebrow">03 · Vivência multicultural</span><h2 class="h2">Onde aprendemos a trabalhar com quem é diferente</h2></div>
      ${C.ONDE_ESTAMOS ? `<div class="onde"><b>ONDE ESTAMOS</b><span>${esc(C.ONDE_ESTAMOS)}</span></div>` : ''}
    </div>
    <div class="trips">
      ${D.trips.map(t => { const m = membros.find(x => x.nome === t.nome) || {}; return `
        <div class="trip" style="--c:${m.cor};--t:${m.cor}22">
          <span class="when">${esc(t.periodo || '—')}</span>
          <div class="where"><span class="kind">${t.intl ? 'Internacional' : 'Nacional'}</span><span>${esc(t.local)}</span></div>
          <p>${esc(t.texto)}</p>
          <span class="quem">${esc(short(t.nome))}</span>
        </div>`; }).join('')}
      ${membros.filter(m => !comTrip.has(m.nome)).map(m => `
        <div class="trip vazio" style="--c:${m.cor};--t:${m.cor}22">
          <span class="when">[Ano]</span>
          <div class="where"><span class="kind">[Tipo]</span><span>[Local]</span></div>
          <p>[Vivência a preencher no formulário]</p>
          <span class="quem">${esc(short(m.nome))}</span>
        </div>`).join('')}
    </div>
  </section>`;

  const skills = `
  <section id="competencias" class="block">
    <div style="margin-bottom:24px"><span class="eyebrow">04 · As 4 competências</span><h2 class="h2">Soft skills com prova</h2></div>
    ${D.skills.map(k => `
      <div class="skill" style="--c:${k.cor};--t:${k.tint}">
        <div class="skill-name"><i></i><h3>${esc(k.label)}</h3><span>${k.quem.length ? esc(k.quem.join(' · ')) : '[Sem integrante ainda]'}</span></div>
        <div class="skill-ev">
          ${k.ev.length ? k.ev.map(v => `<figure><blockquote>“${esc(v.txt)}”</blockquote><figcaption>${esc(short(v.quem))}</figcaption></figure>`).join('')
            : `<figure class="empty"><blockquote>[Exemplo a preencher pelo integrante no formulário]</blockquote><figcaption>${k.quem.length ? esc(k.quem.join(' · ')) : '[Integrante]'}</figcaption></figure>`}
        </div>
      </div>`).join('')}
  </section>`;

  const stepCor = ['#1F5FD6', '#13A3AF', '#F08A1C', '#E4237A'];
  const casoPh = [['Contexto', '[Empresa, área, período e papel do integrante.]'], ['Desafio', '[O problema, o que estava em risco e a principal restrição.]'], ['Ação', '[O que foi feito, em que ordem, e como a competência apareceu.]'], ['Resultado', '[Indicador] passou de [valor] para [valor] em [período].']];
  const passos = D.caso ? D.caso.passos : casoPh;
  const caso = `
  <section id="caso" class="block cinza">
    <div class="block-head">
      <div><span class="eyebrow">05 · Caso real em destaque</span><h2 class="h2${D.caso ? '' : ' vazio'}">${D.caso ? esc(D.caso.titulo) : '[Título do caso — aguardando envio]'}</h2></div>
      ${D.caso ? `<div style="display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--texto-2)"><span><strong style="color:var(--grafite)">${esc(D.caso.quem)}</strong>${D.caso.soft ? ' · ' + esc(D.caso.soft.label) : ''}</span>${D.caso.meta ? `<span>${esc(D.caso.meta)}</span>` : ''}</div>` : ''}
    </div>
    <ol class="steps${D.caso ? '' : ' vazio'}">
      ${passos.map((p, i) => `<li style="--c:${stepCor[i % 4]}"><div class="top"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="lbl">${p[0]}</span></div><p>${esc(p[1])}</p></li>`).join('')}
    </ol>
  </section>`;

  const closing = `
  <section class="closing">
    <p class="phrase">${esc(C.FRASE_FINAL)}<span>.</span></p>
    <div class="decl">
      <p>A equipe AUTH informa que os integrantes a seguir colaboraram efetivamente na realização do desafio:</p>
      <div class="decl-names">${membros.map(m => `<span style="--c:${m.cor}">${esc(m.nome)}</span>`).join('')}</div>
    </div>
    <footer class="foot"><span>AUTH · MBA Online FGV · ${esc(C.DISCIPLINA)} · ${esc(C.DATA)}</span><img src="assets/logo-auth.png" alt=""></footer>
  </section>
  <div class="faixa" style="height:8px"></div>`;

  document.getElementById('app').innerHTML = status + nav + cover + manifesto + cards + matrix + trips + skills + caso + closing;
  document.getElementById('baixarPpt').addEventListener('click', e => { e.preventDefault(); window.AUTH_PPT.gerar(e.currentTarget); });
})();
</script>
</body>
</html>
